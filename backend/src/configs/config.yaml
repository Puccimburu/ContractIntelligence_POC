# ─────────────────────────────────────────────
# LLM
# ─────────────────────────────────────────────
GEMINI_MODEL: "gemini-2.5-flash-lite"
GEMINI_REASONING_MODEL: "gemini-2.5-pro"
OPENAI_MODEL: "gpt-4o-mini"
LLM_PROVIDER: "gemini"
REGION_CONSTRAINT_LLM: False
GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}

# Sensitive
GEMINI_API_KEY: ${GEMINI_API_KEY}

# ─────────────────────────────────────────────
# Storage
# ─────────────────────────────────────────────
DOCUMENTS_CONTAINER_DIR: "documents"

# ─────────────────────────────────────────────
# OCR (Windows local)
# ─────────────────────────────────────────────
TESSERACT_CMD_FOR_WINDOWS: ${TESSERACT_CMD_FOR_WINDOWS}
POPPLER_BIN_PATH_FOR_WINDOWS: ${POPPLER_BIN_PATH_FOR_WINDOWS}
POPPLER_BIN_PATH_FOR_LINUX: '/usr/bin'

# ─────────────────────────────────────────────
# MongoDB
# ─────────────────────────────────────────────
MONGODB_URI: ${MONGODB_URI}
MONGODB_DB_NAME: ${MONGODB_DB_NAME}

# ─────────────────────────────────────────────
# Qdrant
# ─────────────────────────────────────────────
QDRANT_CLUSTER_URL: ${QDRANT_CLUSTER_URL}
QDRANT_PORT: 6333
QDRANT_API_KEY: ${QDRANT_API_KEY}
QDRANT_COLLECTION_NAME: "howden_dora_article_data"

# ─────────────────────────────────────────────
# Concurrency
# ─────────────────────────────────────────────
TOTAL_CONCURRENT_LIMIT: 5
SCANNED_PDF_CONCURRENT_LIMIT: 1

# ─────────────────────────────────────────────
# Security / Server
# ─────────────────────────────────────────────
JWT_SECRET: ${JWT_SECRET}
TRUSTED_HOSTS: "localhost,127.0.0.1,localhost:5173,localhost:8000"
ENABLE_HTTPS_REDIRECT: false
CORSMIDDLEWARE_ORIGINS_ADDRESSES: ["http://localhost:3000","http://localhost:5173"]
